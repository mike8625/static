<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>写作陪跑助手</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='4' width='24' height='24' fill='%23fff' stroke='%23d97a7a' stroke-width='2'/%3E%3Cpath d='M16 4v24M4 16h24' stroke='%23d97a7a' stroke-width='1'/%3E%3C/svg%3E">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #ececec;
      font-family: "KaiTi", "STKaiti", "楷体", "FangSong", "仿宋", system-ui, sans-serif;
      color: #222;
      padding: 16px 12px;
    }
    .paper {
      background: #fff;
      max-width: 820px;
      margin: 0 auto;
      padding: 18px 20px 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,.15);
    }
    .topbar {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-bottom: 14px;
    }
    button {
      border: 1px solid #444;
      background: #2a2e33;
      color: #fff;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 15px;
      min-height: 44px;
      cursor: pointer;
      font-family: inherit;
    }
    button.primary { background: #1f6f43; border-color: #2e9e63; }
    button:hover { filter: brightness(1.15); }

    .grid {
      display: grid;
      grid-template-columns: repeat(20, 1fr);
      border-top: 1px solid #d97a7a;
      border-left: 1px solid #d97a7a;
    }
    .cell {
      aspect-ratio: 1 / 1;
      border-right: 1px solid #d97a7a;
      border-bottom: 1px solid #d97a7a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      line-height: 1;
      overflow: hidden;
      color: transparent;
      transition: color 0.3s ease;
    }
    .cell.show { color: #222; }
    .cell.title-cell { font-weight: 700; }

    .stats {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }
    .card {
      background: #f6f6f6;
      border: 1px solid #e3e3e3;
      border-radius: 10px;
      padding: 10px 12px;
    }
    .card .k { font-size: 13px; color: #888; }
    .card .v { font-size: 20px; font-weight: 700; margin-top: 2px; }
    button:disabled { opacity: .4; cursor: not-allowed; }

    .paper-footer {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: #888;
    }

    /* 弹出层 */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }
    .modal[hidden] { display: none; }
    .modal-box {
      background: #fff;
      border-radius: 14px;
      width: 100%;
      max-width: 480px;
      padding: 18px;
    }
    .modal-box h2 { font-size: 17px; margin: 0 0 14px; }
    .done-stats p { font-size: 15px; color: #333; margin: 8px 0; }
    .done-stats span { font-weight: 700; }
    .modal-box label { display: block; font-size: 14px; color: #555; margin: 10px 0 6px; }
    .modal-box textarea {
      width: 100%;
      min-height: 150px;
      border: 1px solid #3a3f45;
      border-radius: 8px;
      padding: 10px;
      font-size: 16px;
      font-family: inherit;
      resize: vertical;
      outline: none;
    }
    .modal-box input[type="number"] {
      width: 120px;
      border: 1px solid #3a3f45;
      border-radius: 8px;
      padding: 9px 10px;
      font-size: 16px;
      font-family: inherit;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 16px;
    }

    @page { size: A4 portrait; margin: 12mm; }
    @media print {
      body { background: #fff; padding: 0; }
      .paper { box-shadow: none; max-width: none; margin: 0; padding: 0; }
      .topbar, .modal { display: none !important; }
      .cell { font-size: 18px; }
    }
    @media (max-width: 600px) {
      body { padding: 8px; }
      .paper { padding: 12px 8px 16px; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .topbar { margin-bottom: 10px; }
      button { padding: 9px 12px; font-size: 14px; min-height: 40px; }
      .cell { font-size: 13px; }
      .modal-box { padding: 14px; }
    }
  </style>
</head>
<body>
  <div class="paper">
    <div class="topbar">
      <button id="btnReset">重置</button>
      <button id="btnPause" disabled>暂停</button>
      <button id="btnStart" class="primary">开始写作</button>
    </div>

    <div class="stats">
      <div class="card"><div class="k">开始时间</div><div class="v" id="timeStart" style="font-size:16px;">--:--:--</div></div>
      <div class="card"><div class="k">结束时间</div><div class="v" id="timeEnd" style="font-size:16px;">--:--:--</div></div>
      <div class="card"><div class="k">已用时</div><div class="v" id="timeElapsed">0:00</div></div>
      <div class="card"><div class="k">暂停时长</div><div class="v" id="timePaused">0:00</div></div>
      <div class="card"><div class="k">字数</div><div class="v" id="wordCount" style="font-size:16px;">0/0 字</div></div>
    </div>

    <div class="grid" id="grid" role="grid" aria-label="作文方格"></div>

    <div class="paper-footer">
      <span>20 列方格</span>
      <span id="sheetLabel">第 1 篇</span>
    </div>
  </div>

  <!-- 写作设置弹出层 -->
  <div id="modal" class="modal" hidden>
    <div class="modal-box">
      <h2>写作设置</h2>
      <label for="essayInput">作文内容（第一行为标题）</label>
      <textarea id="essayInput" placeholder="第一行写标题；第二行开始写正文，每行开头会自动空两格。"></textarea>
      <label for="interval">多少秒写一个字</label>
      <input type="number" id="interval" step="0.1" min="0.05" value="1.5">
      <div class="modal-actions">
        <button id="btnClose">关闭</button>
        <button id="btnBegin" class="primary">开始</button>
      </div>
    </div>
  </div>

  <!-- 完成提示弹窗 -->
  <div id="doneModal" class="modal" hidden>
    <div class="modal-box" style="text-align:center;">
      <h2>已完成</h2>
      <div class="done-stats">
        <p>总字数：<span id="doneTotal">0</span> 字</p>
        <p>开始时间：<span id="doneStart">--:--:--</span></p>
        <p>结束时间：<span id="doneEnd">--:--:--</span></p>
        <p>用时：<span id="doneElapsed">0:00</span></p>
        <p>暂停：<span id="donePaused">0:00</span></p>
      </div>
      <div class="modal-actions" style="justify-content:center;">
        <button id="btnDoneOk" class="primary">确定</button>
      </div>
    </div>
  </div>

  <script>
    const COLS = 20;
    const INIT_ROWS = 20;
    const CAPACITY = COLS * INIT_ROWS; // 一篇 400 格
    const PARAGRAPH_GAP = 2000; // 自然段之间停顿 2 秒

    const grid = document.getElementById('grid');
    const modal = document.getElementById('modal');
    const essayInput = document.getElementById('essayInput');
    const intervalInput = document.getElementById('interval');
    const wordCount = document.getElementById('wordCount');
    const btnPause = document.getElementById('btnPause');
    const timeElapsed = document.getElementById('timeElapsed');
    const timePaused = document.getElementById('timePaused');
    const doneModal = document.getElementById('doneModal');
    const doneTotal = document.getElementById('doneTotal');
    const doneElapsed = document.getElementById('doneElapsed');
    const donePaused = document.getElementById('donePaused');
    const sheetLabel = document.getElementById('sheetLabel');
    const timeStart = document.getElementById('timeStart');
    const timeEnd = document.getElementById('timeEnd');
    const doneStart = document.getElementById('doneStart');
    const doneEnd = document.getElementById('doneEnd');

    let cells = [];
    let wakeLock = null;
    let audioCtx = null;

    // 在用户点击“开始”的手势里解锁音频上下文，避免结束时被浏览器拦截
    function ensureAudio() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      } catch (e) { console.warn('音频初始化失败', e); }
    }

    // 完成提示音：清脆响亮的上行铃声，约 3 秒
    function playFinishSound() {
      try {
        if (!audioCtx) return;
        const t0 = audioCtx.currentTime;
        const dur = 3;
        const master = audioCtx.createGain();
        master.gain.setValueAtTime(0, t0);
        master.gain.linearRampToValueAtTime(0.5, t0 + 0.05);
        master.gain.setValueAtTime(0.5, t0 + dur - 0.5);
        master.gain.linearRampToValueAtTime(0, t0 + dur);
        master.connect(audioCtx.destination);
        // 高频上行音列，音色更亮更清脆
        [880, 1108.73, 1318.51, 1760].forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          osc.type = 'triangle';
          osc.frequency.value = freq;
          const g = audioCtx.createGain();
          g.gain.setValueAtTime(0.28, t0 + i * 0.12);
          osc.connect(g);
          g.connect(master);
          osc.start(t0 + i * 0.12);
          osc.stop(t0 + dur);
        });
      } catch (e) { console.warn('提示音播放失败', e); }
    }

    // status: idle | running | paused
    const S = {
      status: 'idle',
      rows: [], r: 0, c: 0, shownChars: 0,
      sheet: 1, sheetPos: 0,
      timer: null, nextDelay: 0,
      stopwatch: null,
      elapsedMs: 0, pausedMs: 0, activeStart: 0, pauseStart: null,
      totalChars: 0, startTime: null, endTime: null, autoPaused: false
    };

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
      } catch (e) { console.warn('屏幕常亮申请失败', e); }
    }
    function releaseWakeLock() {
      if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
    }

    function fmt(ms) {
      const s = Math.floor(ms / 1000);
      const m = Math.floor(s / 60);
      return m + ':' + String(s % 60).padStart(2, '0');
    }
    function fmtTime(d) {
      if (!d) return '--:--:--';
      return [d.getHours(), d.getMinutes(), d.getSeconds()].map(n => String(n).padStart(2, '0')).join(':');
    }
    function updateClock() {
      const elapsed = S.elapsedMs + (S.status === 'running' ? performance.now() - S.activeStart : 0);
      const paused = S.pausedMs + (S.status === 'paused' && S.pauseStart != null ? performance.now() - S.pauseStart : 0);
      timeElapsed.textContent = fmt(elapsed);
      timePaused.textContent = fmt(paused);
    }

    function addCell() {
      const c = document.createElement('div');
      c.className = 'cell';
      grid.appendChild(c);
      cells.push(c);
    }
    function rebuildGrid() {
      grid.innerHTML = '';
      cells = [];
      for (let i = 0; i < COLS * INIT_ROWS; i++) addCell();
    }

    function schedule(delay) {
      S.nextDelay = delay;
      S.timer = setTimeout(step, delay);
    }

    // 写满一篇（400 格）后清空，开新一篇
    function ensureSheetCell() {
      if (S.sheetPos >= CAPACITY) {
        S.sheet++;
        S.sheetPos = 0;
        rebuildGrid();
        sheetLabel.textContent = `第 ${S.sheet} 篇`;
      }
    }

    // 进入下一个自然段：对齐到下一行开头
    function nextRow() {
      S.r++;
      S.c = 0;
      S.sheetPos = Math.ceil(S.sheetPos / COLS) * COLS;
    }

    function step() {
      if (S.status !== 'running') return;
      if (S.r >= S.rows.length) { finish(); return; }
      const row = S.rows[S.r];

      // 开头缩进的空格：瞬间填好，不占用逐字等待时间
      while (S.c < row.length && row[S.c].ch === '') {
        ensureSheetCell();
        const cell = cells[S.sheetPos];
        cell.textContent = '';
        if (row[S.c].title) cell.classList.add('title-cell');
        S.sheetPos++;
        S.c++;
      }

      // 整行为空：直接进入下一段
      if (S.c >= row.length) { nextRow(); schedule(PARAGRAPH_GAP); return; }

      const t = row[S.c];
      ensureSheetCell();
      const cell = cells[S.sheetPos];
      cell.textContent = t.ch;
      cell.classList.add('show');
      if (t.title) cell.classList.add('title-cell');
      if (t.ch) S.shownChars++;
      wordCount.textContent = `${S.shownChars}/${S.totalChars} 字`;
      S.sheetPos++;
      S.c++;

      // 当前自然段写完：停顿 2 秒再开始下一段；否则按单字间隔继续
      if (S.c >= row.length) { nextRow(); schedule(PARAGRAPH_GAP); }
      else { schedule(Number(intervalInput.value) * 1000); }
    }

    function finish() {
      S.timer = null;
      // 把最后一段进行中的用时并入累计
      if (S.status === 'running') S.elapsedMs += performance.now() - S.activeStart;
      S.endTime = new Date();
      S.status = 'idle';
      stopStopwatch();
      // releaseWakeLock();
      wordCount.textContent = `${S.shownChars}/${S.totalChars} 字`;
      timeEnd.textContent = fmtTime(S.endTime);
      updatePauseBtn();
      updateClock();
      // 先弹窗，再播音，避免音频异常挡住弹窗
      doneTotal.textContent = S.totalChars;
      doneStart.textContent = fmtTime(S.startTime);
      doneEnd.textContent = fmtTime(S.endTime);
      doneElapsed.textContent = fmt(S.elapsedMs);
      donePaused.textContent = fmt(S.pausedMs);
      doneModal.hidden = false;
      playFinishSound();
    }

    function startStopwatch() {
      S.activeStart = performance.now();
      S.stopwatch = setInterval(updateClock, 200);
    }
    function stopStopwatch() {
      if (S.stopwatch) { clearInterval(S.stopwatch); S.stopwatch = null; }
    }

    function pauseWriting(auto) {
      if (S.status !== 'running') return;
      S.status = 'paused';
      S.autoPaused = !!auto;
      if (S.timer) { clearTimeout(S.timer); S.timer = null; }
      S.elapsedMs += performance.now() - S.activeStart;
      S.pauseStart = performance.now();
      // releaseWakeLock();
      updatePauseBtn();
      updateClock();
    }

    function resumeWriting() {
      if (S.status !== 'paused') return;
      if (S.pauseStart != null) {
        S.pausedMs += performance.now() - S.pauseStart;
        S.pauseStart = null;
      }
      S.autoPaused = false;
      S.status = 'running';
      S.activeStart = performance.now();
      // requestWakeLock();
      schedule(S.nextDelay);
      updatePauseBtn();
      updateClock();
    }

    function updatePauseBtn() {
      btnPause.disabled = (S.status === 'idle');
      btnPause.textContent = S.status === 'paused' ? '继续' : '暂停';
    }

    function clearWriting() {
      if (S.timer) { clearTimeout(S.timer); S.timer = null; }
      stopStopwatch();
      S.status = 'idle';
      S.rows = []; S.r = 0; S.c = 0; S.shownChars = 0;
      S.sheet = 1; S.sheetPos = 0;
      S.elapsedMs = 0; S.pausedMs = 0; S.activeStart = 0; S.pauseStart = null;
      S.startTime = null; S.endTime = null; S.autoPaused = false;
      releaseWakeLock();
      doneModal.hidden = true;
      rebuildGrid();
      sheetLabel.textContent = '第 1 篇';
      timeStart.textContent = '--:--:--';
      timeEnd.textContent = '--:--:--';
      wordCount.textContent = '0/0 字';
      updatePauseBtn();
      updateClock();
    }

    // 按自然段排版：去掉空行和所有空格；标题空 4 格，正文空 2 格
    function buildLayout(text) {
      const lines = text.split(/\r?\n/)
        .map(line => line.replace(/\s+/g, ''))
        .filter(clean => clean.length > 0);
      return lines.map((clean, li) => {
        const indent = li === 0 ? 4 : 2;
        const row = [];
        for (let k = 0; k < indent; k++) row.push({ ch: '', title: li === 0 });
        for (const ch of clean) row.push({ ch, title: li === 0 });
        return row;
      });
    }

    function startWriting() {
      const text = essayInput.value;
      const sec = Number(intervalInput.value);
      if (!text.trim()) { alert('请输入作文内容'); return; }
      if (!(sec > 0)) { alert('请填写正确的速度（大于 0 的秒数）'); return; }

      clearWriting();
      modal.hidden = true;
      doneModal.hidden = true;
      ensureAudio();

      S.rows = buildLayout(text);
      S.totalChars = S.rows.reduce((n, row) => n + row.filter(t => t.ch).length, 0);
      wordCount.textContent = `0/${S.totalChars} 字`;
      S.startTime = new Date();
      timeStart.textContent = fmtTime(S.startTime);
      timeEnd.textContent = '--:--:--';

      S.status = 'running';
      startStopwatch();
      requestWakeLock();
      updatePauseBtn();
      schedule(sec * 1000);
    }

    // 切到后台 / 锁屏：自动暂停；回到前台后若为自动暂停则自动继续，手动暂停保持暂停
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') {
        if (S.status === 'running') pauseWriting(true);
      } else {
        if (S.status === 'paused' && S.autoPaused) resumeWriting();
      }
    });

    document.getElementById('btnStart').addEventListener('click', () => { modal.hidden = false; });
    document.getElementById('btnClose').addEventListener('click', () => { modal.hidden = true; });
    document.getElementById('btnBegin').addEventListener('click', startWriting);
    document.getElementById('btnReset').addEventListener('click', clearWriting);
    document.getElementById('btnDoneOk').addEventListener('click', () => { doneModal.hidden = true; releaseWakeLock();});
    btnPause.addEventListener('click', () => {
      if (S.status === 'running') pauseWriting(false);
      else if (S.status === 'paused') resumeWriting();
    });

    rebuildGrid();
    updatePauseBtn();
  </script>
</body>
</html>
