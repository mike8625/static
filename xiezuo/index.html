<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>作文纸逐字书写</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, sans-serif;}
body{background:#fff;padding:10px;}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap;}
.info-text{font-size:14px;color:#333;}
.btn{padding:8px 14px;font-size:15px;border:none;border-radius:6px;background:#2b78e4;color:#fff;}
.btn:disabled{background:#aaa;}
.paper{border:1px solid #ccc;padding:8px;position:relative;}
.grid-row{display:flex;}
.grid-cell{width:calc(100% / 20);aspect-ratio:1 / 1;border:1px solid #ed7878;display:flex;align-items:center;justify-content:center;font-size:18px;color:#000;overflow:hidden;}
.grid-cell span{opacity:0;transition:opacity 0.3s ease;}
.grid-cell span.show{opacity:1;}
.page-info{text-align:center;margin-top:10px;font-size:15px;color:#444;}
.mask{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:99;}
.dialog{background:#fff;padding:20px;border-radius:10px;width:90%;max-width:380px;}
.dialog textarea{width:100%;height:160px;padding:8px;font-size:16px;margin:8px 0;border:1px solid #ccc;border-radius:6px;}
.dialog .row{margin:6px 0;}
.dialog button{margin:6px 4px;padding:7px 12px;font-size:15px;}
.result-dialog{white-space:pre-line;}
</style>
</head>
<body>
<div class="top-bar">
  <div class="info-text" id="statText">0/400 字</div>
  <div>
    <span class="info-text" id="timeInfo"></span>
    <button class="btn" id="startWriteBtn">开始写作</button>
    <button class="btn" id="pauseBtn" disabled>暂停</button>
  </div>
</div>

<div class="paper" id="paper"></div>
<div class="page-info" id="pageInfo">第 1 篇</div>

<!-- 输入弹窗 -->
<div class="mask" id="inputMask">
  <div class="dialog">
    <div class="row">输入作文内容（第一行为标题）：</div>
    <textarea id="contentInput"></textarea>
    <div class="row">每个字间隔秒数：<input type="number" id="speedInput" value="1.5" step="0.1" min="0.1"></div>
    <div class="row">
      <button id="confirmInput">开始</button>
      <button id="closeInput">取消</button>
    </div>
  </div>
</div>

<!-- 完成结果弹窗 -->
<div class="mask" id="resultMask">
  <div class="dialog result-dialog" id="resultContent"></div>
</div>

<script>
const GRID_PER_PAGE = 400;
const COLS = 20;
const ROWS = GRID_PER_PAGE / COLS;

const paperEl = document.getElementById('paper');
const statTextEl = document.getElementById('statText');
const timeInfoEl = document.getElementById('timeInfo');
const pageInfoEl = document.getElementById('pageInfo');
const startWriteBtn = document.getElementById('startWriteBtn');
const pauseBtn = document.getElementById('pauseBtn');
const inputMask = document.getElementById('inputMask');
const resultMask = document.getElementById('resultMask');
const contentInput = document.getElementById('contentInput');
const speedInput = document.getElementById('speedInput');
const confirmInput = document.getElementById('confirmInput');
const closeInput = document.getElementById('closeInput');
const resultContent = document.getElementById('resultContent');

let wakeLock = null;
let isWakeLockActive = false;

let contentList = [];
let speedSec = 1.5;
let currentIndex = 0;
let currentPage = 1;
let timerId = null;
let isPaused = false;
let isRunning = false;

let startTime = null;
let endTime = null;
let pauseTotalMs = 0;
let pauseStartTs = null;
let isAutoPause = false;

function buildPaper(){
  paperEl.innerHTML = '';
  for(let r=0;r<ROWS;r++){
    const row = document.createElement('div');
    row.className = 'grid-row';
    for(let c=0;c<COLS;c++){
      const cell = document.createElement('div');
      cell.className = 'grid-cell';
      const span = document.createElement('span');
      cell.appendChild(span);
      row.appendChild(cell);
    }
    paperEl.appendChild(row);
  }
}
function clearPaper(){
  document.querySelectorAll('.grid-cell span').forEach(s=>{
    s.textContent = '';
    s.classList.remove('show');
  })
}
function updateStat(){
  const total = contentList.length;
  const done = Math.min(currentIndex, total);
  statTextEl.textContent = `${done}/${GRID_PER_PAGE} 字`;
  pageInfoEl.textContent = `第 ${currentPage} 篇`;
}
function formatTime(ms){
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${m}分${sec}秒`;
}
function formatDate(ts){
  if(!ts) return '-';
  const d = new Date(ts);
  return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}:${d.getSeconds().toString().padStart(2,'0')}`;
}

async function requestWakeLock(){
  try{
    if('wakeLock' in navigator && !wakeLock){
      wakeLock = await navigator.wakeLock.request('screen');
      isWakeLockActive = true;
      wakeLock.addEventListener('release', ()=>{
        wakeLock = null;
        isWakeLockActive = false;
      })
    }
  }catch(e){
    console.log('常亮申请失败', e);
  }
}
async function releaseWakeLock(){
  if(wakeLock){
    await wakeLock.release();
    wakeLock = null;
    isWakeLockActive = false;
  }
}

function parseText(raw){
  const lines = raw.split('\n').map(item=>item.replace(/\s+/g,'')).filter(item=>item.length>0);
  const out = [];
  for(let i=0;i<lines.length;i++){
    const line = lines[i];
    if(i===0){
      out.push('　　');
    }else{
      out.push('　');
    }
    out.push(...line.split(''));
  }
  return out;
}

async function showFinishDialog(){
  isRunning = false;
  pauseBtn.disabled = true;
  endTime = Date.now();
  clearTimeout(timerId);
  const useMs = endTime - startTime - pauseTotalMs;
  resultContent.innerText = `已完成！
总字数：${contentList.length}
开始时间：${formatDate(startTime)}
结束时间：${formatDate(endTime)}
有效书写用时：${formatTime(useMs)}
累计暂停时长：${formatTime(pauseTotalMs)}`;
  resultMask.style.display = 'flex';
  // 重点：弹窗弹出时，不释放常亮！等点击确定再释放
}
resultMask.addEventListener('click', async (e)=>{
  if(e.target === resultMask){
    resultMask.style.display = 'none';
    await releaseWakeLock(); // 点击关闭弹窗，才取消屏幕常亮
  }
})

async function nextChar(){
  if(isPaused || !isRunning) return;
  const cellIdx = currentIndex % GRID_PER_PAGE;
  const rowIdx = Math.floor(cellIdx / COLS);
  const colIdx = cellIdx % COLS;
  const cell = paperEl.children[rowIdx].children[colIdx];
  const span = cell.querySelector('span');
  span.textContent = contentList[currentIndex];
  setTimeout(()=>span.classList.add('show'), 20);
  currentIndex++;
  updateStat();

  if(currentIndex >= contentList.length){
    await showFinishDialog();
    return;
  }
  if(currentIndex % GRID_PER_PAGE === 0){
    currentPage++;
    clearPaper();
  }
  const wait = speedSec * 1000;
  timerId = setTimeout(nextChar, wait);
}

async function startWrite(){
  await requestWakeLock();
  clearPaper();
  currentIndex = 0;
  currentPage = 1;
  isPaused = false;
  isRunning = true;
  startTime = Date.now();
  endTime = null;
  pauseTotalMs = 0;
  pauseStartTs = null;
  startWriteBtn.disabled = true;
  pauseBtn.disabled = false;
  updateStat();
  nextChar();
}

pauseBtn.onclick = async ()=>{
  if(!isRunning) return;
  if(isPaused){
    // 继续
    const addPause = Date.now() - pauseStartTs;
    pauseTotalMs += addPause;
    isPaused = false;
    pauseStartTs = null;
    pauseBtn.textContent = '暂停';
    nextChar();
  }else{
    // 手动暂停
    isPaused = true;
    pauseStartTs = Date.now();
    pauseBtn.textContent = '继续';
    clearTimeout(timerId);
  }
}

startWriteBtn.onclick = ()=>{
  inputMask.style.display = 'flex';
}
closeInput.onclick = ()=>{
  inputMask.style.display = 'none';
}
confirmInput.onclick = async ()=>{
  const raw = contentInput.value;
  speedSec = Number(speedInput.value) || 1.5;
  contentList = parseText(raw);
  inputMask.style.display = 'none';
  await startWrite();
}

// 页面可见性监听（切后台锁屏）
document.addEventListener('visibilitychange', async ()=>{
  if(!isRunning) return;
  if(document.hidden){
    if(!isPaused){
      isPaused = true;
      pauseStartTs = Date.now();
      isAutoPause = true;
      clearTimeout(timerId);
    }
  }else{
    if(isAutoPause && isPaused){
      const addPause = Date.now() - pauseStartTs;
      pauseTotalMs += addPause;
      isPaused = false;
      isAutoPause = false;
      pauseStartTs = null;
      nextChar();
    }
  }
})

buildPaper();
updateStat();
</script>
</body>
</html>
